  <desc id="desc">2026년 10월 21일 기준 전체 출시 진척률 13.8퍼센트, 레벨 디자인 및 BM 76.1퍼센트, 상점 17.5퍼센트와 당일 및 주간 달성률을 보여준다.</desc>
